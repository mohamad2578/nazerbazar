# ساخت اپلیکیشن اندروید ناظر ۷۲۴ روی سرورهای گیت‌هاب.
# خروجی (فایل APK) در صفحه همین اجرا، بخش Artifacts قابل دانلود است.
# اگر Secrets امضا تعریف شده باشد، نسخه انتشار امضاشده ساخته می‌شود؛ وگرنه نسخه آزمایشی (debug).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: نصب وابستگی‌ها و همگام‌سازی Capacitor
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: آماده‌سازی کلید امضا
        id: sign
        env:
          KS_B64: ${{ secrets.NAZER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nazer724.jks"
            echo "file=$RUNNER_TEMP/nazer724.jks" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secrets امضا تعریف نشده؛ نسخه آزمایشی (debug) ساخته می‌شود."
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
          fi

      - name: ساخت APK
        working-directory: mobile/android
        env:
          NAZER_KEYSTORE_FILE: ${{ steps.sign.outputs.file }}
          NAZER_KEYSTORE_PASSWORD: ${{ secrets.NAZER_KEYSTORE_PASSWORD }}
          NAZER_KEY_ALIAS: ${{ secrets.NAZER_KEY_ALIAS }}
          NAZER_KEY_PASSWORD: ${{ secrets.NAZER_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ steps.sign.outputs.task }} --no-daemon
          mkdir -p ../out
          find app/build/outputs/apk -name "*.apk" -exec cp {} ../out/ \;
          for f in ../out/*.apk; do mv "$f" "../out/nazer724-1.0.${{ github.run_number }}-$(basename "$f")"; done
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: nazer724-android-${{ github.run_number }}
          path: mobile/out/*.apk
          retention-days: 30
