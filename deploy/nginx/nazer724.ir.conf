# میزبانی دامنه nazer724.ir روی پورت ۸۰ سرور، با پراکسی به کانتینر این پروژه (۸۰۹۷).
# محل نصب: /etc/nginx/sites-available/nazer724.ir  و لینک در sites-enabled
#
# این فایل عمدا default_server ندارد؛ پروژه‌های دیگر روی همین پورت دست‌نخورده می‌مانند
# و فقط درخواست‌هایی که Host آن‌ها nazer724.ir است به این پروژه می‌روند.

server {
    listen 80;
    listen [::]:80;
    server_name nazer724.ir www.nazer724.ir;

    client_max_body_size 64m;
    access_log /var/log/nginx/nazer724.access.log;
    error_log  /var/log/nginx/nazer724.error.log;

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;

        # $http_host (نه $host) تا پورت و نام دامنه دست‌نخورده برسد؛
        # جنگو از همین برای ساخت آدرس مطلق تصویرها استفاده می‌کند.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }
}
