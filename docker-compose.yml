services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nazerbazar}
      POSTGRES_USER: ${DB_USER:-nazerbazar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nazerbazar}"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-nazerbazar}:${DB_PASSWORD}@db:5432/${DB_NAME:-nazerbazar}
      MEDIA_ROOT: /media
    volumes: [media:/media]
    depends_on:
      db: { condition: service_healthy }

  # اجرای ساعتی snapshot قیمت و اسکن هشدارها (ایدمپوتنت؛ هر روز یک ردیف)
  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-nazerbazar}:${DB_PASSWORD}@db:5432/${DB_NAME:-nazerbazar}
    command: sh -c "sleep 60; while true; do python manage.py daily_jobs; sleep 3600; done"
    depends_on: [backend]

  web:
    build: ./frontend
    restart: unless-stopped
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes: [media:/media:ro]
    depends_on: [backend]

volumes:
  pgdata:
  media:
