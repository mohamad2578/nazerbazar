# پشت nginx میزبان (HTTPS) هستیم: اگر پروکسی بیرونی schema اصلی را فرستاده، همان را به جنگو
# می‌دهیم تا آدرس مطلق تصویرها https بسازد؛ وگرنه مرورگر آن‌ها را «محتوای ناامن» می‌بندد.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    client_max_body_size 64m;   # فایل پشتیبان ممکن است بزرگ باشد
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $fwd_proto; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /django-admin/ { proxy_pass http://backend:8000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $fwd_proto; }
    location /static/ { proxy_pass http://backend:8000; }
    location /media/ { alias /media/; expires 7d; }

    root /usr/share/nginx/html;
    # service worker و manifest نباید کش شوند تا نسخه جدید PWA سریع برسد
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; }
}
